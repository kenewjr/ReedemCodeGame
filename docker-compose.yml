services:
  redeem-relay:
    build: .
    container_name: redeem-relay
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - POLL_SECONDS=60
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/your/webhook/url
      - CAMOFOX_URL=http://camofox:9377
    volumes:
      - ./data:/app/data
    depends_on:
      camofox:
        condition: service_healthy

  camofox:
    image: ghcr.io/jo-inc/camofox-browser:latest
    container_name: camofox-browser
    restart: always
    ports:
      - "9377:9377"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9377/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
