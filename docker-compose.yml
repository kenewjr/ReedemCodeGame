services:
  redeem-relay:
    build: .
    container_name: redeem-relay
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - POLL_SECONDS=60
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/your/webhook/url
      - CAMOFOX_URL=http://camofox:9377
    volumes:
      - ./data:/app/data
    depends_on:
      camofox:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/version', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  camofox:
    image: ghcr.io/jo-inc/camofox-browser:latest
    container_name: camofox-browser
    restart: always
    ports:
      - "9377:9377"
    environment:
      - CAMOFOX_API_KEY=kizoxy-secret-2026
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9377"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

